# Publishes to PyPI via OIDC trusted publishing — no token lives in this
# repo. One-time setup this file depends on:
#   * PyPI → Publishing → pending publisher: project xplane-dataref-mcp,
#     owner Santisoutoo, repo xplane-dataref-mcp, workflow release.yml,
#     environment pypi (same on test.pypi.org with environment testpypi).
#   * GitHub → Settings → Environments: create `pypi` and `testpypi`.
# A version tag (`git tag v0.1.0 && git push origin v0.1.0`) releases to
# PyPI; a manual run rehearses the same pipeline against TestPyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rehearsal: publishes to TestPyPI instead

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Tag must match the built version
        if: github.ref_type == 'tag'
        # Guards against publishing 0.1.0 from a tag that says v0.2.0.
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC — this is what replaces a password
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
